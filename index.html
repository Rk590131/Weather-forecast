<html>
<head>
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="weather-card">
        <h1>Weather App</h1>
        <p class="subtitle">Check the weather in your city</p>

        <div class="search-box">
            <input type="text" id="city" placeholder="Enter city name">
            <button onclick="getWeather()">Search</button>
        </div>

        <p id="message">Enter a city to see its weather.</p>

        <div id="weather" class="weather-info">
            <h2 id="cityName"></h2>
            <div id="icon" class="weather-icon">🌤️</div>
            <h1 id="temperature">--°C</h1>
            <p id="condition">Weather condition</p>

            <div class="details">
                <div>
                    <span>💧</span>
                    <p>Humidity</p>
                    <h3 id="humidity">--%</h3>
                </div>

                <div>
                    <span>🌡️</span>
                    <p>Feels Like</p>
                    <h3 id="feelsLike">--°C</h3>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
